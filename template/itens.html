<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Simulador de Dano</title>

<link rel="stylesheet" href="../static/itens.css">

<!-- Fonte estilo LoL -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="overlay"></div>

<div class="container">

    <div class="frame-top"></div>

    <h1>Simulador de Dano</h1>

    <p class="subtitle">
        Teste combinações de crítico, letalidade e itens lendários.
    </p>

    <div class="inputs">

        <div class="input-box">
            <label>AD</label>
            <input type="number" id="ad">
        </div>

        <div class="input-box">
            <label>Chance de Crítico (%)</label>
            <input type="number" id="crit">
        </div>

        <div class="input-box">
            <label>Penetração (%)</label>
            <input type="number" id="pen">
        </div>

        <div class="input-box">
            <label>Letalidade</label>
            <input type="number" id="letalidade">
        </div>

        <div class="input-box">
            <label>Vida do inimigo</label>
            <input type="number" id="vida">
        </div>

        <div class="input-box">
            <label>Armadura do inimigo</label>
            <input type="number" id="armor">
        </div>

        <div class="input-box full">
            <label>Item</label>

            <select id="item">
                <option value="0">Nenhum</option>
                <option value="1">Espada do Rei</option>
                <option value="2">Gume do Infinito</option>
                <option value="3">Coletora</option>
            </select>
        </div>

    </div>

    <button onclick="calcular()">
        Simular Combate
    </button>

    <div class="resultado" id="resultado"></div>

</div>

<script>
function calcular() {

    let ad = Number(document.getElementById("ad").value);
    let chanceCrit = Number(document.getElementById("crit").value) / 100;
    let armorpen = Number(document.getElementById("pen").value) / 100;
    let letalidade = Number(document.getElementById("letalidade").value);
    let vidaInimigo = Number(document.getElementById("vida").value);
    let armor = Number(document.getElementById("armor").value);
    let item = Number(document.getElementById("item").value);

    let resultadoDiv = document.getElementById("resultado");

    resultadoDiv.innerHTML = "";

    if (
        isNaN(ad) ||
        isNaN(chanceCrit) ||
        isNaN(armorpen) ||
        isNaN(letalidade) ||
        isNaN(vidaInimigo) ||
        isNaN(armor)
    ) {
        alert("Preencha todos os campos!");
        return;
    }

    let armorMenosPen = armor * (1 - armorpen);
    let armorFinal = armorMenosPen - letalidade;

    let danoPorAA = ad * (100 / (100 + armorFinal));
    let danoCrit = danoPorAA * 2;

    let vidaAtual = vidaInimigo;
    let ataques = 0;
    let crits = 0;

    while (vidaAtual > 0) {

        let dano = 0;

        let isCrit = Math.random() < chanceCrit;

        if (isCrit) {

            dano = danoCrit;
            crits++;

            if (item === 2) {
                dano = danoCrit * 1.3;
            }

        } else {

            dano = danoPorAA;
        }

        let vidaPerdida = vidaInimigo - vidaAtual;

        if (item === 1) {
            dano += 0.1 * vidaInimigo;
        }

        if (item === 3) {
            dano += 0.1 * vidaPerdida;
        }

        vidaAtual -= dano;

        if (vidaAtual < 0) {
            vidaAtual = 0;
        }

        ataques++;

        resultadoDiv.innerHTML += `
        
        <div class="combat-log ${isCrit ? 'crit' : ''}">

            <div class="attack-title">
                ⚔️ Ataque ${ataques}
            </div>

            <div class="damage">
                Dano causado:
                <span>${dano.toFixed(2)}</span>
            </div>

            <div class="life">
                Vida restante:
                <span>${vidaAtual.toFixed(2)}</span>
            </div>

            ${isCrit ? '<div class="crit-text">CRÍTICO!</div>' : ''}

        </div>
        `;
    }

    resultadoDiv.innerHTML += `

    <div class="final-box">

        <h2>Resultado Final</h2>

        <p>Total de ataques:
        <span>${ataques}</span></p>

        <p>Críticos:
        <span>${crits}</span></p>

    </div>
    `;
}
</script>

</body>
</html>
